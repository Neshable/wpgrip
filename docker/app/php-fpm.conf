[www]
user  = www-data
group = www-data

; Listen on all interfaces so Caddy can reach it across the Docker network
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Pass all env vars through to PHP
clear_env = no

; Logging
access.log = /dev/null
php_flag[display_errors] = off
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
